[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bpd-helper"
version = "2.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.3"]


[tool.setuptools]
py-modules = [
    "bpd_helper",
    "behavior_variable_values",
    "output_links",
    "variable_link_templates",
    "command_writer",
    "yaml_writer",
]
